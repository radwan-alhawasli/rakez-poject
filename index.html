<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Enhanced Responsive Viewport Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes, viewport-fit=cover">

    <!-- Mobile Web App Capable -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="راكز العقارية">

    <!-- Theme Colors -->
    <meta name="theme-color" content="#B1A28F" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
    <meta name="msapplication-TileColor" content="#1e3a5f">
    <meta name="msapplication-navbutton-color" content="#B1A28F">
    <meta name="apple-mobile-web-app-status-bar-style" content="#B1A28F">

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.rakez.com.sa ws: ws://localhost:* http://localhost:* http://127.0.0.1:* ws://127.0.0.1:* wss: https://*.pusher.com https://*.pusherapp.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">

    <!-- SEO Meta Tags -->
    <meta name="description" content="راكز العقارية - منصة عقارية فاخرة لإدارة المشاريع والعقود">
    <meta name="keywords" content="عقارات، راكز، مشاريع عقارية، إدارة عقارية">
    <meta name="author" content="Rakez Real Estate">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="راكز العقارية - Rakez Real Estate">
    <meta property="og:description" content="منصة عقارية فاخرة لإدارة المشاريع والعقود">
    <meta property="og:image" content="/img/logo-circle.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="راكز العقارية - Rakez Real Estate">
    <meta name="twitter:description" content="منصة عقارية فاخرة لإدارة المشاريع والعقود">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/logo-circle.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/logo-circle.png">

    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <title>راكز العقارية - Rakez Real Estate</title>

    <!-- Prevent flash of wrong theme: apply dark class before first paint -->
    <script>
      (function(){
        var s = localStorage.getItem('rakez-dark-mode');
        if (s === 'true' || (s === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Prevent Flash of Unstyled Content while maintaining perceived performance */
      html:not(.loaded) body {
        visibility: hidden;
      }

      body {
        opacity: 1;
        transition: opacity 0.3s ease-in;
      }

      /* Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #fdfbf7 0%, #ffffff 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }

      html.dark #loading-screen {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }

      html.dark #loading-screen .loading-spinner {
        border-color: rgba(196, 181, 162, 0.15);
        border-top-color: #c4b5a2;
      }

      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(177, 162, 143, 0.2);
        border-top-color: #B1A28F;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Prevent Horizontal Scroll */
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-spinner"></div>
    </div>

    <noscript>
      <strong>عذراً، يتطلب التطبيق تفعيل JavaScript للعمل بشكل صحيح. الرجاء تفعيله للمتابعة.</strong>
    </noscript>

    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>

    <!-- Remove Loading Screen After App Loads -->
    <script>
      (function () {
        var didReveal = false;

        function reveal() {
          if (didReveal) return;
          didReveal = true;
          document.documentElement.classList.add('loaded');
          document.body.classList.add('loaded');
          var loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.classList.add('hidden');
            setTimeout(function () {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }

        // Preferred: reveal as soon as the Vue app reports it's mounted.
        window.addEventListener('rakez:app-mounted', reveal, { once: true });

        // Fallback: if the event never fires, keep previous behavior (but without extra delay).
        window.addEventListener('load', reveal, { once: true });
      })();
    </script>
  </body>
</html>
