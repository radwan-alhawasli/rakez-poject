name: CI

on:
  push:
    branches:
      - master
      - main
      - new
  pull_request:
    branches:
      - master
      - main
      - new

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (checkJs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: v-html allowlist
        run: npm run check:v-html

      - name: Dangerous DOM / HTML sinks
        run: npm run check:dangerous-dom

      - name: Unit tests
        run: npm run test:run

      - name: Critical-path coverage (layout + marketing composables)
        run: npm run test:coverage:critical

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run build:check-budget

  e2e-smoke:
    name: E2E (preview, seeded auth)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Preview + Playwright (all e2e)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          PREVIEW_PID=$!
          echo "Waiting for Vite preview on 127.0.0.1:4173 (pid ${PREVIEW_PID})..."
          READY=0
          for _ in $(seq 1 90); do
            if ! kill -0 "${PREVIEW_PID}" 2>/dev/null; then
              echo "Preview process exited before becoming ready."
              wait "${PREVIEW_PID}" || true
              exit 1
            fi
            if curl -sf "http://127.0.0.1:4173/" >/dev/null; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "${READY}" -ne 1 ]; then
            echo "Preview did not respond in time (check port 4173)."
            kill "${PREVIEW_PID}" 2>/dev/null || true
            exit 1
          fi
          curl -sf "http://127.0.0.1:4173/" >/dev/null
          npx playwright test e2e

  api-integration:
    name: Live API smoke (optional)
    runs-on: ubuntu-latest
    needs: quality
    env:
      STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - name: Checkout
        if: env.STAGING_API_BASE_URL != ''
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: env.STAGING_API_BASE_URL != ''
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.STAGING_API_BASE_URL != ''
        run: npm ci

      - name: API integration tests
        if: env.STAGING_API_BASE_URL != ''
        env:
          VITE_APP_API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
          INTEGRATION_API_BASE_URL: ${{ env.STAGING_API_BASE_URL }}
        run: npx vitest run tests/integration/api-integration.test.js
