name: CI

on:
  push:
    branches:
      - master
      - main
      - new
  pull_request:
    branches:
      - master
      - main
      - new

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

  api-integration:
    name: Live API smoke (optional)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ secrets.STAGING_API_BASE_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: API integration tests
        env:
          VITE_APP_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          INTEGRATION_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx vitest run tests/integration/api-integration.test.js
