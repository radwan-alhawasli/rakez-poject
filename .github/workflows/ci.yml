name: CI

on:
  push:
    branches:
      - master
      - main
      - new
  pull_request:
    branches:
      - master
      - main
      - new

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (checkJs)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: v-html allowlist
        run: npm run check:v-html

      - name: Dangerous DOM / HTML sinks
        run: npm run check:dangerous-dom

      - name: Unit tests
        run: npm run test:run

      - name: Critical-path coverage (layout + marketing composables)
        run: npm run test:coverage:critical

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run build:check-budget

  e2e-smoke:
    name: E2E (preview, seeded auth)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Preview + Playwright (all e2e)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:4173/" >/dev/null; then break; fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:4173/" >/dev/null
          npx playwright test e2e

  api-integration:
    name: Live API smoke (optional)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        run: npm ci

      - name: API integration tests
        if: ${{ secrets.STAGING_API_BASE_URL != '' }}
        env:
          VITE_APP_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          INTEGRATION_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: npx vitest run tests/integration/api-integration.test.js
